[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paimem"
version = "0.1.0"
authors = [
    {name = "Weijian Xie"},
    {name = "Lihui Shi"},
    {name = "Xinyue Zhang"},
    {name = "Xiaodong Gao"},
]
description = "Long-term memory with hybrid retrieval and context-aware evidence selection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*.txt"]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1,<2",
    "datasets>=4,<5",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1.40,<3",
    "portalocker>=2.8,<4",
    "sentence-transformers>=3,<6",
    "torch>=2.3,<3",
    "tqdm>=4.66,<5",
    "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/vikotse/PaiMem"
Documentation = "https://github.com/vikotse/PaiMem#readme"
Issues = "https://github.com/vikotse/PaiMem/issues"

[project.scripts]
paimem = "paimem.cli:main"
paimem-serve = "paimem.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<10"]
